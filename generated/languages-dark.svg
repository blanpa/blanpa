<svg width="460" height="200" viewBox="0 0 460 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Most used languages">
<style>
@font-face {
  font-family: "JetBrains Mono";
  font-style: normal;
  font-weight: 400;
  src: url("data:font/woff2;base64,") format("woff2");
}

@font-face {
  font-family: "JetBrains Mono";
  font-style: normal;
  font-weight: 600;
  src: url("data:font/woff2;base64,") format("woff2");
}

.kicker {
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  fill: #d9744a;
}

.title {
  font-family: "Iowan Old Style", Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
  font-size: 21px;
  font-weight: 600;
  letter-spacing: -0.005em;
  fill: #e7e4de;
}

.lang {
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  font-weight: 400;
  fill: #e7e4de;
}

.pct {
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  font-weight: 400;
  fill: #6e6a63;
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}
</style>

<defs>
<clipPath id="bar-clip">
<rect x="28" y="94" width="404" height="8" rx="2" />
</clipPath>
</defs>

<rect x="0.5" y="0.5" width="459" height="199" rx="3" fill="#16171a" stroke="#2c2d31" />

<text class="kicker" x="28" y="34">LANGUAGES</text>
<text class="title" x="28" y="60">By file size</text>
<line x1="28" y1="76.5" x2="432" y2="76.5" stroke="#2c2d31" stroke-width="1" />

<g clip-path="url(#bar-clip)">
<rect x="28" y="94" width="404" height="8" fill="#2c2d31" />
<rect x="28.00" y="94" width="163.77" height="8" fill="#f1e05a" />
<rect x="191.77" y="94" width="66.74" height="8" fill="#3572A5" />
<rect x="258.51" y="94" width="47.11" height="8" fill="#e34c26" />
<rect x="305.62" y="94" width="38.52" height="8" fill="#3178c6" />
<rect x="344.14" y="94" width="37.27" height="8" fill="#00ADD8" />
<rect x="381.41" y="94" width="50.59" height="8" fill="#8b949e" />

</g>

<rect x="28" y="122" width="8" height="8" rx="2" fill="#f1e05a" />
<text class="lang" x="45" y="130">JavaScript</text>
<text class="pct" x="220" y="130" text-anchor="end">40.5%</text>
<rect x="28" y="146" width="8" height="8" rx="2" fill="#3572A5" />
<text class="lang" x="45" y="154">Python</text>
<text class="pct" x="220" y="154" text-anchor="end">16.5%</text>
<rect x="28" y="170" width="8" height="8" rx="2" fill="#e34c26" />
<text class="lang" x="45" y="178">HTML</text>
<text class="pct" x="220" y="178" text-anchor="end">11.7%</text>
<rect x="240" y="122" width="8" height="8" rx="2" fill="#3178c6" />
<text class="lang" x="257" y="130">TypeScript</text>
<text class="pct" x="432" y="130" text-anchor="end">9.5%</text>
<rect x="240" y="146" width="8" height="8" rx="2" fill="#00ADD8" />
<text class="lang" x="257" y="154">Go</text>
<text class="pct" x="432" y="154" text-anchor="end">9.2%</text>
<rect x="240" y="170" width="8" height="8" rx="2" fill="#8b949e" />
<text class="lang" x="257" y="178">Other</text>
