<svg width="460" height="200" viewBox="0 0 460 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Most used languages">
<style>
@font-face {
  font-family: "JetBrains Mono";
  font-style: normal;
  font-weight: 400;
  src: url("data:font/woff2;base64,{{ mono_regular }}") format("woff2");
}

@font-face {
  font-family: "JetBrains Mono";
  font-style: normal;
  font-weight: 600;
  src: url("data:font/woff2;base64,{{ mono_semibold }}") format("woff2");
}

.kicker {
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  fill: {{ accent }};
}

.title {
  font-family: "Iowan Old Style", Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
  font-size: 21px;
  font-weight: 600;
  letter-spacing: -0.005em;
  fill: {{ fg }};
}

.lang {
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  font-weight: 400;
  fill: {{ fg }};
}

.pct {
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  font-weight: 400;
  fill: {{ muted }};
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}
</style>

<defs>
<clipPath id="bar-clip">
<rect x="28" y="94" width="404" height="8" rx="2" />
</clipPath>
</defs>

<rect x="0.5" y="0.5" width="459" height="199" rx="3" fill="{{ bg }}" stroke="{{ border }}" />

<text class="kicker" x="28" y="34">LANGUAGES</text>
<text class="title" x="28" y="60">By file size</text>
<line x1="28" y1="76.5" x2="432" y2="76.5" stroke="{{ border }}" stroke-width="1" />

<g clip-path="url(#bar-clip)">
<rect x="28" y="94" width="404" height="8" fill="{{ track }}" />
{{ bar }}
</g>

{{ legend }}
</svg>
