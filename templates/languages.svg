<svg width="460" height="200" viewBox="0 0 460 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Most used languages">
<style>
@font-face {
  font-family: "Space Grotesk";
  font-style: normal;
  font-weight: 700;
  src: url("data:font/woff2;base64,{{ font }}") format("woff2");
}

.kicker {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  fill: {{ accent }};
}

.title {
  font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.02em;
  fill: {{ fg }};
}

.lang {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
  fill: {{ fg }};
}

.pct {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
  fill: {{ muted }};
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}
</style>

<defs>
<clipPath id="bar-clip">
<rect x="28" y="92" width="404" height="10" rx="5" />
</clipPath>
</defs>

<rect x="0.5" y="0.5" width="459" height="199" rx="12" fill="{{ bg }}" stroke="{{ border }}" />

<text class="kicker" x="28" y="34">LANGUAGES</text>
<text class="title" x="28" y="58">By file size</text>
<line x1="28" y1="74.5" x2="432" y2="74.5" stroke="{{ border }}" stroke-width="1" />

<g clip-path="url(#bar-clip)">
<rect x="28" y="92" width="404" height="10" fill="{{ track }}" />
{{ bar }}
</g>

{{ legend }}
</svg>
