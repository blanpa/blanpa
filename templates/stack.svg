<svg width="940" height="226" viewBox="0 0 940 226" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tech stack">
<style>
@font-face {
  font-family: "JetBrains Mono";
  font-style: normal;
  font-weight: 400;
  src: url("data:font/woff2;base64,{{ mono_regular }}") format("woff2");
}

@font-face {
  font-family: "JetBrains Mono";
  font-style: normal;
  font-weight: 600;
  src: url("data:font/woff2;base64,{{ mono_semibold }}") format("woff2");
}

.kicker {
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  fill: {{ accent }};
}

.title {
  font-family: "Iowan Old Style", Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
  font-size: 21px;
  font-weight: 600;
  letter-spacing: -0.005em;
  fill: {{ fg }};
}

.label {
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0.06em;
  fill: {{ muted }};
}

.item {
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px;
  font-weight: 400;
  fill: {{ fg }};
}

.sep {
  fill: {{ accent }};
}
</style>

<rect x="0.5" y="0.5" width="939" height="225" rx="3" fill="{{ bg }}" stroke="{{ border }}" />

<text class="kicker" x="28" y="34">STACK</text>
<text class="title" x="28" y="60">Edge to cloud</text>
<line x1="28" y1="76.5" x2="912" y2="76.5" stroke="{{ border }}" stroke-width="1" />

{{ rows }}
</svg>
